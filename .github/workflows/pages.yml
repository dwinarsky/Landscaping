name: Deploy to GitHub Pages

# The site is plain static files - no build step - so this just uploads the
# repository root. Set Pages source to "GitHub Actions" in the repository
# settings once and every push to these branches publishes.

on:
  push:
    branches:
      - main
      - master
      - claude/interactive-landscaping-map-a3bc8e
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The legend quantities are a checksum over the hand-read callouts, so a
      # bad transcription should fail the build rather than ship quietly.
      - name: Check the plan data against the legend
        run: python3 tools/validate.py

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
