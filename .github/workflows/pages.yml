name: Validate plan data

# This used to publish the repository root to GitHub Pages. It no longer does.
# Pages serves publicly regardless of repository visibility, and this site names
# a private residence, so the site was unpublished deliberately. A deploy job
# left in here would have quietly put the address back on the open internet on
# the next push.
#
# The checksum gate is worth keeping on its own: the plant legend quantities are
# a checksum over the hand-read hexagon callouts, so a bad transcription fails
# here rather than sitting in the data unnoticed.

on:
  push:
    branches:
      - main
      - master
      - claude/interactive-landscaping-map-a3bc8e
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the plan data against the legend
        run: python3 tools/validate.py
